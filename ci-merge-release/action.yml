name: CI, merge, release
description: >
  Dispatch the caller's ci.yml on a bot PR branch, wait for it, squash-merge the
  PR on green, then dispatch the caller's release.yml on main.

# PRs opened with GITHUB_TOKEN don't fire other workflows' pull_request trigger,
# so CI would never run on them. workflow_dispatch is exempt from that rule; its
# checks land on the branch head and show on the PR. Wait for it, merge on green,
# then release (a GITHUB_TOKEN merge fires no push event, so nothing else would).
# The calling job needs `actions: write`, `contents: write`, `pull-requests: write`.

inputs:
  branch:
    description: "PR head branch"
    required: true
  pr:
    description: "PR number"
    required: true
  sha:
    description: "PR head commit sha"
    required: true
  notes:
    description: "Release notes passed to release.yml (blank = its default)"
    required: false
    default: ""
  token:
    description: "Token for gh"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        PR: ${{ inputs.pr }}
        SHA: ${{ inputs.sha }}
        NOTES: ${{ inputs.notes }}
      run: |
        set -euo pipefail
        gh workflow run ci.yml --ref "$BRANCH"
        run_id=""
        for _ in $(seq 30); do
          run_id="$(gh run list --workflow ci.yml --commit "$SHA" --event workflow_dispatch -L 1 --json databaseId -q '.[0].databaseId')"
          [ -n "$run_id" ] && break
          sleep 5
        done
        [ -n "$run_id" ] || { echo "::error::CI run for $SHA never appeared"; exit 1; }
        gh run watch "$run_id" --exit-status
        gh pr merge "$PR" --squash --delete-branch
        if [ -n "$NOTES" ]; then
          gh workflow run release.yml --ref main -f notes="$NOTES"
        else
          gh workflow run release.yml --ref main
        fi
