name: Sync phrases to CurseForge

# Uploads the English phrase set from <Addon>_Tracker_Local_Zones/Locales/enUS.lua
# to CurseForge Localization (add/update only -- never --prune), so translators
# always have the current source strings. Idempotent: safe to re-run.
#
# enUS.lua is the source of truth. The reverse direction (approved translations
# back into Locales/<code>.lua) is refresh-locales.yml.
#
# Called with `secrets: inherit`; the addon folder and CurseForge project id come
# from the caller's checkout/.toc (tools/push_locale_phrases.py).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: deploy          # CF_API_KEY lives here (same as release.yml)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push English phrases to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python tools/push_locale_phrases.py
