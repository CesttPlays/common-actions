name: Release

# Packages the addon with the BigWigs packager (fetches Libs per .pkgmeta,
# builds the zip, creates a GitHub Release, and uploads to CurseForge using
# ## X-Curse-Project-ID from the .toc + the CF_API_KEY environment secret).
#
# Reusable: each "Local Zones" repo calls this file via workflow_call from a thin
# release.yml carrying the workflow_run/workflow_dispatch triggers below (a
# called workflow sees the caller's github.event, so the dispatch inputs and the
# CI run are the caller's). The addon folder is found at runtime
# (*_Tracker_Local_Zones); only the data file and default notes are inputs.
#
# Triggers:
#   1. A *successful* CI run on main whose triggering push changed the data file
#      (MountData.lua, ZoneData.lua, ...) or a Locales/*.lua file. refresh-data.yml
#      and refresh-locales.yml open PRs that only touch those files when something
#      actually moved, so merging such a PR is the release signal -- but the
#      release waits for CI to be green on the merge commit rather than running
#      in parallel with it. Always uploaded to CurseForge as a full "Release".
#   2. Manual dispatch: choose the CurseForge Release Type (Release / Beta /
#      Alpha) for the upload, plus an optional exact version (blank = bump patch).
#
# The BigWigs packager has no flag for the CurseForge Release Type -- it reads it
# from the git tag name (a tag containing "beta"/"alpha" uploads as that type,
# anything else as Release). So the choice is encoded as a tag suffix:
# release -> vX.Y.Z, beta -> vX.Y.Z-beta, alpha -> vX.Y.Z-alpha.
#
# Every run rewrites `## Version:` in the .toc to the computed version and
# commits it [skip ci] so the tagged tree is self-consistent. Only a Release
# pushes that commit to main (CI does not run on the bump, so no CI-completed
# event fires and this workflow does not re-trigger); beta/alpha keep the commit
# on the tag only and leave main untouched.
#
# Note: if CI fails on the merge commit, no release fires. Push the fix; if that
# commit also touches those files the release fires on its green CI run,
# otherwise re-release via manual dispatch.
#
# The release refuses to run (before tagging) when the .toc has no
# ## X-Curse-Project-ID -- create the CurseForge project first.

on:
  workflow_call:
    inputs:
      data_file:
        description: "Datamined file in the addon folder whose change triggers a release"
        type: string
        required: true
      notes:
        description: "Default release notes"
        type: string
        default: "Updated data."

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One place decides whether a release should happen: manual dispatch always
  # proceeds; a CI-completed event proceeds only when it was a successful,
  # push-triggered CI run on main whose push actually moved the data file or a
  # locale file.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Decide whether to release
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          DATA_FILE: ${{ inputs.data_file }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "manual dispatch -> release"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_CONCLUSION" != success ] || [ "$CI_EVENT" != push ]; then
            echo "CI run was '$CI_CONCLUSION' from '$CI_EVENT' -> skip"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          addon="$(ls -d *_Tracker_Local_Zones)"
          changed="$(git diff --name-only "${CI_SHA}^" "$CI_SHA")"
          if grep -qxF "${addon}/${DATA_FILE}" <<< "$changed" \
              || grep -qE "^${addon}/Locales/[^/]+\.lua$" <<< "$changed"; then
            echo "data/locale file changed in $CI_SHA -> release"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no data/locale change in $CI_SHA -> skip"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # CF_API_KEY lives in the "deploy" environment; the job must target it to
    # read the secret (and to honour any environment protection rules).
    environment: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Compute version and tag
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          # empty on the workflow_run trigger -> defaults to a full Release
          CF_TYPE: ${{ github.event.inputs.curseforge_release_type }}
        run: |
          set -euo pipefail
          addon="$(ls -d *_Tracker_Local_Zones)"
          TOC="${addon}/${addon}.toc"
          cf_type="${CF_TYPE:-release}"

          # Fail before tagging/pushing: without a project id the packager
          # would silently skip the CurseForge upload.
          if ! grep -qP '^## X-Curse-Project-ID:\s*\d+' "$TOC"; then
            echo "::error::${TOC} has no ## X-Curse-Project-ID -- create the CurseForge project first"
            exit 1
          fi
          current="$(grep -oP '^## Version:\s*\K[0-9.]+' "$TOC")"
          echo "current TOC version: ${current}, CurseForge release type: ${cf_type}"

          # Sanity check: refuse to publish a build declaring compatibility
          # below 12.1.0 -- catches an accidental revert of ## Interface that
          # CI's test_toc.py would also fail, but this also covers the manual
          # workflow_dispatch path, which skips CI entirely.
          min_iface=120100
          lowest="$(grep -oP '^## Interface:\s*\K.+' "$TOC" | tr -d ' ' | tr ',' '\n' | sort -n | head -1)"
          if [ -z "${lowest}" ] || [ "${lowest}" -lt "${min_iface}" ]; then
            echo "::error::TOC declares Interface '${lowest:-<none>}', below the ${min_iface} (12.1.0) floor"
            exit 1
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            IFS='.' read -r major minor patch <<< "${current}"
            version="${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          fi
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::computed version '${version}' is not X.Y.Z"
            exit 1
          fi

          # The packager derives the CurseForge Release Type from the tag name,
          # so encode the choice as a suffix.
          case "${cf_type}" in
            release) tag="v${version}" ;;
            beta)    tag="v${version}-beta" ;;
            alpha)   tag="v${version}-alpha" ;;
            *) echo "::error::unknown release type '${cf_type}'"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists -- pass an explicit 'version' or delete the tag"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "cf_type=${cf_type}"
            echo "toc=${TOC}"
          } >> "$GITHUB_OUTPUT"
          echo "Uploading ${tag} to CurseForge as: ${cf_type}"

      - name: Bump TOC, tag, and (for a Release) push main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          CF_TYPE: ${{ steps.ver.outputs.cf_type }}
          TOC: ${{ steps.ver.outputs.toc }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always write the computed version into the tree the tag points at, so
          # the packaged build is self-consistent -- even a beta/alpha that never
          # lands on main ships the right ## Version:.
          sed -i -E "s/^## Version:.*/## Version: ${VERSION}/" "${TOC}"
          git add "${TOC}"
          git diff --cached --quiet || git commit -m "release: ${TAG} [skip ci]"

          # A full Release advances main; beta/alpha keep the bump on the tag
          # alone. Push main before tagging so a rejected push leaves no tag.
          if [ "${CF_TYPE}" = "release" ]; then
            git push origin HEAD:main
          else
            echo "Beta/Alpha upload -- main left untouched"
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

      # .pkgmeta's manual-changelog points the packager at this file, so the
      # GitHub Release + CurseForge changelog is just the version and the note
      # instead of the git log.
      - name: Write changelog
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ github.event.inputs.notes || inputs.notes }}
        run: printf '## %s\n\n%s\n' "$TAG" "$NOTES" > CHANGELOG.md

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          # packager reads GITHUB_OAUTH (not GITHUB_TOKEN) for the GitHub Release
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # CurseForge: project id is ## X-Curse-Project-ID in the .toc;
          # CF_API_KEY is an environment secret (environment: deploy above)
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
